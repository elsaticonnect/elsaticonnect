<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Sign In | Elsati Connect</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    font-family:"Manrope","Plus Jakarta Sans",Arial,sans-serif;
    color:#10263d;
    background:
        radial-gradient(circle at 15% 15%,rgba(191,224,211,.65),transparent 30%),
        radial-gradient(circle at 85% 25%,rgba(196,218,238,.75),transparent 35%),
        linear-gradient(135deg,#eaf4f2 0%,#edf5f8 50%,#e7f0f5 100%);
    padding:15px 2px 35px;
    overflow-x:hidden;
}

.page{width:100%;max-width:1400px;margin:0 auto}

.top-header{
    min-height:202px;
    width:100%;
    background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(248,251,253,.96));
    border-radius:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 25px 60px rgba(24,50,69,.13);
    border:1px solid rgba(255,255,255,.85);
}

.logo{
    width:205px;
    height:auto;
    display:block;
}

.profile-circle{
    position:absolute;
    right:30%;
    top:50%;
    transform:translateY(-50%);
    width:72px;
    height:72px;
    border-radius:50%;
    background:linear-gradient(145deg,#fff,#f5f8fa);
    border:1px solid #e5eaed;
    box-shadow:0 12px 28px rgba(16,38,61,.08);
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-icon{width:28px;height:28px;position:relative}
.profile-icon:before{
    content:"";
    position:absolute;
    width:11px;height:11px;border-radius:50%;
    background:#10263d;top:0;left:50%;
    transform:translateX(-50%);
}
.profile-icon:after{
    content:"";
    position:absolute;
    width:22px;height:12px;
    border-radius:12px 12px 8px 8px;
    background:#10263d;bottom:1px;left:50%;
    transform:translateX(-50%);
}

.login-area{
    width:100%;
    max-width:1350px;
    margin:145px auto 0;
    background:#fff;
    border-radius:32px;
    padding:0 32px 42px;
    box-shadow:0 22px 60px rgba(24,50,69,.09);
}

.intro{margin-bottom:34px}
.intro h1{
    font-size:54px;
    line-height:1.05;
    letter-spacing:-2.5px;
    color:#10263d;
    font-weight:800;
    margin-bottom:22px;
}
.intro h1 span{display:block}
.intro p{
    max-width:1100px;
    font-size:21px;
    line-height:1.7;
    color:#66809a;
    font-weight:500;
}

.form-group{margin-bottom:22px}
label{
    display:block;
    color:#10263d;
    font-size:17px;
    font-weight:700;
    margin-bottom:10px;
}

.input{
    width:100%;
    height:68px;
    border-radius:20px;
    border:1px solid #cfdaeb;
    background:#e7eefb;
    padding:0 20px;
    font-family:"Manrope",sans-serif;
    font-size:19px;
    color:#10263d;
    outline:none;
}
.input::placeholder{color:#10263d;opacity:1}
.input:focus{
    background:#f1f5fc;
    border-color:#2fa463;
    box-shadow:0 0 0 4px rgba(47,164,99,.10);
}

.password-wrapper{position:relative}
.password-wrapper .input{padding-right:65px}
.password-toggle{
    position:absolute;right:18px;top:50%;
    transform:translateY(-50%);
    border:0;background:transparent;
    width:35px;height:35px;
    cursor:pointer;color:#62788b;
    font-size:17px;
}

.options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:40px;
    margin-bottom:42px;
}

.remember{
    display:flex;
    align-items:center;
    gap:13px;
    font-size:17px;
    font-weight:600;
    color:#10263d;
    cursor:pointer;
}
.remember input{
    appearance:none;
    width:21px;height:21px;
    border:1.5px solid #7c858c;
    border-radius:3px;
    background:#fff;
    cursor:pointer;
    position:relative;
}
.remember input:checked{background:#2fa463;border-color:#2fa463}
.remember input:checked:after{
    content:"✓";position:absolute;color:#fff;
    font-size:14px;font-weight:800;left:3px;top:0;
}

.need-account{
    color:#14834d;
    text-decoration:none;
    font-size:17px;
    font-weight:800;
}
.need-account:hover{text-decoration:underline}

.signin-button{
    width:100%;
    height:61px;
    border:0;
    border-radius:32px;
    background:linear-gradient(90deg,#38aa62,#237d47);
    color:#fff;
    font-family:"Manrope",sans-serif;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 15px 30px rgba(47,164,99,.20);
}
.signin-button:hover{transform:translateY(-2px)}
.signin-button:disabled{opacity:.65;cursor:not-allowed}

.register-text{
    margin-top:78px;
    font-size:20px;
    color:#66809a;
    font-weight:500;
}
.register-text a{color:#14834d;font-weight:800;text-decoration:none}
.register-text a:hover{text-decoration:underline}

.message{
    display:none;
    margin-top:20px;
    padding:15px 18px;
    border-radius:13px;
    font-size:14px;
    font-weight:600;
}
.message.error{display:block;background:#fff0ef;color:#a63c37;border:1px solid #f2d0cd}
.message.success{display:block;background:#edf9f1;color:#237d47;border:1px solid #c9ead5}

@media(max-width:1100px){
    .profile-circle{right:10%}
}
@media(max-width:800px){
    body{padding:8px 2px 25px}
    .top-header{min-height:150px;border-radius:28px}
    .logo{width:165px}
    .profile-circle{right:30px;width:58px;height:58px}
    .login-area{margin-top:80px;border-radius:25px;padding:0 22px 35px}
    .intro h1{font-size:39px;letter-spacing:-1.5px}
    .intro p{font-size:17px;line-height:1.6}
    .input{height:60px;font-size:16px;border-radius:16px}
    .options{margin-top:28px;margin-bottom:30px;align-items:flex-start;gap:20px}
    .remember,.need-account{font-size:14px}
    .need-account{white-space:nowrap}
    .register-text{margin-top:50px;font-size:16px}
}
@media(max-width:520px){
    .profile-circle{right:18px;width:52px;height:52px}
    .logo{width:145px}
    .login-area{margin-top:55px}
    .intro h1{font-size:34px}
    .options{flex-direction:column;align-items:flex-start}
    .need-account{align-self:flex-end}
}
</style>
</head>

<div class="register-text">
    Need access?
    <a href="register-supplier.html">Register as a supplier</a>
</div>

</main>
</div>

<script>
const supabaseClient = supabase.createClient(
    window.ELSATI_SUPABASE.url,
    window.ELSATI_SUPABASE.publishableKey
);

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const passwordToggle = document.getElementById("passwordToggle");
const signinButton = document.getElementById("signinButton");
const message = document.getElementById("message");
const rememberDevice = document.getElementById("rememberDevice");

passwordToggle.addEventListener("click", function () {
    passwordInput.type =
        passwordInput.type === "password" ? "text" : "password";
});

const savedEmail = localStorage.getItem("elsati_supplier_email");

if (savedEmail) {
    emailInput.value = savedEmail;
    rememberDevice.checked = true;
}

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
}

function clearMessage() {
    message.textContent = "";
    message.className = "message";
}

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    clearMessage();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showMessage("Please enter your email and password.", "error");
        return;
    }

    signinButton.disabled = true;
    signinButton.textContent = "Signing in...";

    try {
        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

        if (error) throw error;

        const user = data.user;

        if (!user) {
            throw new Error("Unable to sign in. Please try again.");
        }

        if (rememberDevice.checked) {
            localStorage.setItem("elsati_supplier_email", email);
        } else {
            localStorage.removeItem("elsati_supplier_email");
        }

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", user.id)
                .single();

        if (profileError) {
            await supabaseClient.auth.signOut();
            throw new Error("Your supplier profile could not be found.");
        }

        if (!profile || profile.role !== "supplier") {
            await supabaseClient.auth.signOut();
            throw new Error("This account is not registered as a supplier.");
        }

        showMessage(
            "Sign in successful. Opening your supplier workspace...",
            "success"
        );

        signinButton.textContent = "Opening dashboard...";

        setTimeout(function() {
            window.location.href = "supplier-dashboard-new.html";
        }, 500);

    } catch (error) {
        console.error("Supplier sign-in error:", error);

        showMessage(
            error.message ||
            "Unable to sign in. Please check your details and try again.",
            "error"
        );

        signinButton.disabled = false;
        signinButton.textContent = "Sign in as Supplier";
    }
});
</script>

</body>
</html>
