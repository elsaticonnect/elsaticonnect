<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RFQs | Elsati Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f9f8;
      color: #17202c;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ================================
       HEADER
    ================================= */

    .header {
      height: 72px;
      background: #ffffff;
      border-bottom: 1px solid #e5e9e7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 35px;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      color: #17202c;
    }

    .logo span {
      color: #2f9e44;
    }

    .supplier-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .supplier-user-text {
      text-align: right;
    }

    .supplier-company {
      font-size: 12px;
      font-weight: 700;
    }

    .supplier-status {
      font-size: 10px;
      color: #2f9e44;
      font-weight: 700;
      margin-top: 3px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #e8f5eb;
      color: #2f9e44;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
    }

    /* ================================
       PAGE
    ================================= */

    .container {
      width: 100%;
      max-width: 1320px;
      margin: auto;
      padding: 30px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 18px;
      gap: 20px;
    }

    .page-header h1 {
      margin: 0 0 5px;
      font-size: 25px;
      letter-spacing: -0.5px;
    }

    .page-header p {
      margin: 0;
      color: #7b8694;
      font-size: 12px;
    }

    .search-area {
      display: flex;
      gap: 8px;
    }

    .search {
      width: 230px;
      height: 37px;
      border: 1px solid #dce3df;
      border-radius: 8px;
      background: white;
      padding: 0 12px;
      outline: none;
      font-size: 11px;
    }

    .search:focus {
      border-color: #2f9e44;
    }

    .filter-button {
      height: 37px;
      background: #ffffff;
      border: 1px solid #dce3df;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 11px;
      font-weight: 700;
      color: #586575;
    }

    /* ================================
       TABS
    ================================= */

    .tabs {
      display: flex;
      gap: 7px;
      margin-bottom: 17px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid #dce3df;
      background: white;
      color: #697586;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
    }

    .tab:hover {
      border-color: #2f9e44;
    }

    .tab.active {
      background: #2f9e44;
      border-color: #2f9e44;
      color: white;
    }

    /* ================================
       RFQ CARDS
    ================================= */

    .rfq-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .rfq-card {
      background: #ffffff;
      border: 1px solid #e3e8e5;
      border-radius: 12px;
      padding: 17px;
      min-height: 230px;
      position: relative;
      box-shadow: 0 3px 12px rgba(0,0,0,0.035);
      transition: .15s ease;
    }

    .rfq-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(0,0,0,0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 8px;
      font-weight: 800;
    }

    .badge-open {
      background: #e7f5eb;
      color: #23813a;
    }

    .badge-direct {
      background: #e8f3ff;
      color: #1670c5;
    }

    .badge-submitted {
      background: #fff3d8;
      color: #916500;
    }

    .code {
      color: #7a8593;
      font-size: 9px;
      font-weight: 700;
    }

    .rfq-card h3 {
      font-size: 16px;
      margin: 16px 0 5px;
    }

    .quantity {
      color: #697586;
      font-size: 10px;
      margin-bottom: 15px;
    }

    .customer {
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .customer-location {
      color: #7b8694;
      font-size: 10px;
      margin-bottom: 14px;
    }

    .card-info {
      display: grid;
      gap: 6px;
      color: #657183;
      font-size: 10px;
    }

    .view-button {
      position: absolute;
      right: 16px;
      bottom: 15px;
      border: none;
      border-radius: 7px;
      background: #2f9e44;
      color: #ffffff;
      padding: 8px 14px;
      font-size: 10px;
      font-weight: 800;
    }

    .view-button:hover {
      background: #27863a;
    }

    /* ================================
       DETAILS
    ================================= */

    #details {
      display: none;
    }

    .back-button {
      border: none;
      background: transparent;
      color: #657183;
      font-size: 11px;
      font-weight: 700;
      padding: 0;
      margin: 28px 0 14px;
    }

    .back-button:hover {
      color: #2f9e44;
    }

    .details-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 17px;
      align-items: start;
    }

    .details-card {
      background: #ffffff;
      border: 1px solid #e3e8e5;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.025);
    }

    .details-heading {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 17px;
      border-bottom: 1px solid #e8ecea;
    }

    .details-heading h2 {
      margin: 8px 0 5px;
      font-size: 21px;
    }

    .meta {
      color: #758191;
      font-size: 10px;
    }

    .closing {
      text-align: right;
      color: #697586;
      font-size: 10px;
    }

    .closing strong {
      display: block;
      color: #263342;
      margin-top: 5px;
    }

    /* ================================
       CUSTOMER
    ================================= */

    .requester {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 17px 0;
      border-bottom: 1px solid #e8ecea;
    }

    .requester-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .company-icon {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      background: #e5f5e9;
      color: #2f9e44;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      font-weight: 800;
    }

    .requested-by {
      color: #7b8695;
      font-size: 9px;
    }

    .customer-name {
      font-size: 13px;
      font-weight: 800;
      margin-top: 3px;
    }

    .customer-location-detail {
      color: #788495;
      font-size: 9px;
      margin-top: 3px;
    }

    .verified-mark {
      color: #2f9e44;
    }

    .profile-button {
      background: white;
      border: 1px solid #dce3df;
      border-radius: 7px;
      padding: 8px 11px;
      font-size: 10px;
      font-weight: 700;
      color: #4f5c6c;
    }

    .profile-button:hover {
      color: #2f9e44;
      border-color: #2f9e44;
    }

    /* ================================
       PROCUREMENT DETAILS
    ================================= */

    .section-title {
      font-size: 12px;
      font-weight: 800;
      margin: 18px 0 9px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #e9eeeb;
      border: 1px solid #e9eeeb;
      border-radius: 8px;
      overflow: hidden;
    }

    .detail-item {
      background: #fbfcfc;
      padding: 11px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 9px;
    }

    .detail-item span {
      color: #697687;
    }

    .detail-item strong {
      text-align: right;
    }

    .requirements {
      color: #596777;
      font-size: 10px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* ================================
       QUOTE FORM
    ================================= */

    .quote-panel {
      background: #f3faf5;
      border: 1px solid #dfede2;
      border-radius: 12px;
      padding: 19px;
      position: sticky;
      top: 20px;
    }

    .quote-panel h2 {
      margin: 0 0 18px;
      color: #287a3b;
      font-size: 17px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-group label {
      display: block;
      color: #344252;
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      border: 1px solid #d9e2dc;
      background: white;
      border-radius: 7px;
      padding: 10px;
      outline: none;
      font-size: 10px;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: #2f9e44;
    }

    .textarea {
      min-height: 80px;
      resize: vertical;
    }

    .confirmation {
      background: #e5f4e9;
      color: #317543;
      border-radius: 7px;
      padding: 10px;
      font-size: 9px;
      line-height: 1.5;
      margin: 12px 0;
    }

    .submit-button {
      width: 100%;
      border: none;
      background: #2f9e44;
      color: white;
      padding: 12px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
    }

    .submit-button:hover {
      background: #27863a;
    }

    .submit-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      font-size: 10px;
      font-weight: 700;
      margin-top: 8px;
    }

    /* ================================
       ERROR
    ================================= */

    .error-box {
      background: #fff;
      border: 1px solid #f0d2d2;
      border-radius: 10px;
      padding: 25px;
      color: #a33a3a;
      font-size: 12px;
    }

    /* ================================
       RESPONSIVE
    ================================= */

    @media(max-width: 950px) {

      .rfq-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .details-layout {
        grid-template-columns: 1fr;
      }

      .quote-panel {
        position: static;
      }

    }

    @media(max-width: 650px) {

      .header {
        padding: 0 18px;
      }

      .container {
        padding: 18px;
      }

      .page-header {
        display: block;
      }

      .search-area {
        margin-top: 14px;
      }

      .search {
        width: 100%;
      }

      .rfq-grid {
        grid-template-columns: 1fr;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .requester {
        align-items: flex-start;
        flex-direction: column;
      }

      .details-heading {
        flex-direction: column;
      }

      .closing {
        text-align: left;
      }

    }
  </style>
</head>


<body>

       HEADER
  ========================================== -->

    <div class="logo">
      ELSATI <span>CONNECT</span>
